server:
  address: 127.0.0.1
  port: 8086
spring:
  application:
    name: fin-form-library
  datasource:
    url: ${FIN_FORM_DB_URL:jdbc:postgresql://127.0.0.1:5433/fin_form_library}
    driver-class-name: ${FIN_FORM_DB_DRIVER:org.postgresql.Driver}
    username: ${FIN_FORM_DB_USER:FIN}
    password: ${FIN_FORM_DB_PASSWORD:FIN}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 32
        order_inserts: true
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  h2:
    console:
      enabled: false

# Public, version-aware reference cache only; never tenant-specific reports.
fin:
  attachments:
    directory: ${FIN_FORM_ATTACHMENT_DIR:./var/form-attachments}
  catalog:
    cache:
      ttl: ${FIN_CATALOG_CACHE_TTL:PT5M}
      max-entries: ${FIN_CATALOG_CACHE_MAX_ENTRIES:512}

# Temporary UAT page; disable/remove it after acceptance.
  uat:
    editor:
      enabled: ${FIN_FORM_UAT_EDITOR_ENABLED:false}

# Disabled by default. Do not bind untrusted network interfaces before
# production deployment has separately approved IAM/S2 and network policy.
  financial-review:
    api-enabled: ${FIN_FINANCIAL_REVIEW_API_ENABLED:false}
    issuer: ${FIN_FINANCIAL_REVIEW_ISSUER:}
    jwk-set-uri: ${FIN_FINANCIAL_REVIEW_JWKS_URI:}
    audience: ${FIN_FINANCIAL_REVIEW_AUDIENCE:fin-form-library/financial-methodology-review/v1}
