name: One-time FIN dependency lockfile bootstrap
on:
  push:
    branches: [feat/fin-r0-r1a]
    paths: [.github/workflows/lock-bootstrap.yml]
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate reviewed lockfile without running install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit reproducible dependency manifest to the existing working branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(fin-r1a): lock resolved npm dependencies"
          git push origin HEAD:feat/fin-r0-r1a
