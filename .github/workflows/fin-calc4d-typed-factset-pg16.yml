name: FIN CALC-4D — Typed DAG & Exact FactSet PG16

on:
  push:
    branches:
      - feat/fin-form-library-standalone
    paths:
      - 'form-library/src/main/java/kz/fin/formlib/calc/plan/Calc4D*.java'
      - 'form-library/src/test/java/kz/fin/formlib/calc/plan/Calc4DTypedPlanPostgresqlTest.java'
      - 'form-library/pom.xml'
      - '.github/workflows/fin-calc4d-typed-factset-pg16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calc4d-typed-factset:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: form-library/pom.xml
      - name: Execute real PostgreSQL 16 source-rehash and DAG acceptance
        run: |
          mvn -B -ntp -f form-library/pom.xml test \
            -Dfin.postgres.uat.enabled=true \
            -Dtest=Calc4DTypedPlanPostgresqlTest \
            -DfailIfNoTests=true
      - name: Require eight actual PostgreSQL tests, zero skipped/failures/errors
        if: always()
        run: |
          python3 - <<'PY'
          import glob,sys,xml.etree.ElementTree as ET
          files=glob.glob('form-library/target/surefire-reports/TEST-*Calc4DTypedPlanPostgresqlTest.xml')
          if len(files)!=1:sys.exit('CALC4D PG16 report missing')
          root=ET.parse(files[0]).getroot()
          a={k:int(root.attrib.get(k,0)) for k in ('tests','errors','failures','skipped')}
          print(a)
          if a!={'tests':8,'errors':0,'failures':0,'skipped':0}:
            sys.exit('CALC4D PG16 eight tests mandatory')
          PY
