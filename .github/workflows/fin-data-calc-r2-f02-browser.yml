name: FIN DATA-CALC-R2.5 — F02 C01 C02 Unified Browser E2E

on:
  push:
    branches:
      - feat/fin-form-library-standalone
    paths:
      - 'frontend/src/App.tsx'
      - 'frontend/src/UatCalculationPanel.tsx'
      - 'frontend/src/api.ts'
      - 'frontend/src/vite-env.d.ts'
      - 'frontend/src/styles.css'
      - 'frontend/e2e/f02-calculation-uat.spec.ts'
      - 'frontend/e2e/c01-c02-calculation-uat.spec.ts'
      - 'form-library/src/main/java/kz/fin/formlib/service/FormDraftService.java'
      - 'form-library/src/main/java/kz/fin/formlib/api/F02IntakeUatPreviewController.java'
      - 'form-library/src/main/java/kz/fin/formlib/calc/ingest/**'
      - '.github/workflows/fin-data-calc-r2-f02-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unified-browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fin_form_library
          POSTGRES_USER: fin
          POSTGRES_PASSWORD: fin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fin -d fin_form_library"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: 'true'
      FIN_FORM_DB_URL: jdbc:postgresql://127.0.0.1:5432/fin_form_library
      FIN_FORM_DB_DRIVER: org.postgresql.Driver
      FIN_FORM_DB_USER: fin
      FIN_FORM_DB_PASSWORD: fin
      FIN_FORM_UAT_EDITOR_ENABLED: 'false'
      FIN_CALC_INTAKE_UAT_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: form-library/pom.xml

      - name: Build backend with exact saved-revision preview
        run: mvn -B -ntp -f form-library/pom.xml -DskipTests package

      - name: Start isolated real PostgreSQL backend
        shell: bash
        run: |
          nohup java -jar form-library/target/fin-form-library-0.1.0-SNAPSHOT.jar \
            > /tmp/fin-dc-r2-f02-backend.log 2>&1 &
          echo $! > /tmp/fin-dc-r2-f02-backend.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent \
              'http://127.0.0.1:8086/api/v1/catalog/navigation?locale=ru' > /dev/null; then
              echo 'FIN DATA-CALC-R2 real PostgreSQL backend ready'
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/fin-dc-r2-f02-backend.pid)" 2>/dev/null; then
              tail -n 120 /tmp/fin-dc-r2-f02-backend.log
              exit 1
            fi
            sleep 2
          done
          tail -n 120 /tmp/fin-dc-r2-f02-backend.log
          exit 1

      - name: Real Chromium F02 C01 C02 save, calculate and compare
        shell: bash
        run: |
          docker run --rm --network host --ipc host \
            -e CI=true -e HOME=/tmp -e VITE_FIN_INTAKE_UAT=true \
            -v "$GITHUB_WORKSPACE/frontend:/work" -w /work \
            mcr.microsoft.com/playwright:v1.56.1-noble \
            bash -lc 'npm install --no-audit --no-fund && npm run test:e2e -- e2e/f02-calculation-uat.spec.ts e2e/c01-c02-calculation-uat.spec.ts'

      - name: Require browser E2E without failure or skip
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('frontend/test-results/junit.xml').getroot()
          suites=[root] if root.tag=='testsuite' else list(root.iter('testsuite'))
          n=sum(int(x.attrib.get('tests',0)) for x in suites)
          errors=sum(int(x.attrib.get('errors',0)) for x in suites)
          failed=sum(int(x.attrib.get('failures',0)) for x in suites)
          skipped=sum(int(x.attrib.get('skipped',0)) for x in suites)
          print({'tests':n,'errors':errors,'failures':failed,'skipped':skipped})
          if n!=3 or errors or failed or skipped:raise SystemExit('FIN_R25_UNIFIED_BROWSER_E2E_NOT_GREEN')
          PY

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-dc-r25-unified-browser
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn

      - name: Backend diagnostics on failure
        if: failure()
        run: tail -n 180 /tmp/fin-dc-r2-f02-backend.log || true
