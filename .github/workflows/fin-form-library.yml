name: FIN Form Library Java 21 H2
on:
  push:
    branches:
      - feat/fin-form-library-standalone
    paths:
      - 'form-library/**'
      - '.github/workflows/fin-form-library.yml'
  pull_request:
    paths:
      - 'form-library/**'
      - '.github/workflows/fin-form-library.yml'
jobs:
  java21-h2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: form-library/pom.xml
      - name: Run JPA Liquibase H2 integration tests
        run: mvn --batch-mode -f form-library/pom.xml clean verify
