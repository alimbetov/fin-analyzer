name: FIN Backend Domain
on:
  push:
    branches: [feat/fin-r0-r1a]
    paths:
      - 'backend/**'
      - '.github/workflows/fin-backend-domain.yml'
  workflow_dispatch:
jobs:
  backend-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build and run JUnit + PostgreSQL Testcontainers
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: Preserve Java diagnostic five-question test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-java-five-question-smoke
          path: |
            backend/target/surefire-reports/*ScenarioFiveQuestionEngineTest*
            backend/target/surefire-reports/*ExtensionSheetContractSmokeTest*
            backend/target/surefire-reports/*ScenarioEconomicsEngineTest*
            backend/src/test/resources/simulation/scenario-five-question-coverage.tsv
          if-no-files-found: warn
          retention-days: 14
