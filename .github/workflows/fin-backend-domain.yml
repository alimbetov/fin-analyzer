name: FIN Backend Domain
on:
  push:
    branches: [feat/fin-r0-r1a]
    paths:
      - 'backend/**'
      - '.github/workflows/fin-backend-domain.yml'
  workflow_dispatch:
concurrency:
  # Cancel outdated feature-branch runs; do not cancel main / PR / manual checks.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/fin-r0-r1a' }}
jobs:
  backend-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: FIN-R8 Flyway version preflight
        run: |
          node --test scripts/check-flyway-versions.test.mjs
          node scripts/check-flyway-versions.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Provision offline PDF renderer fonts (Latin, Kazakh, Simplified Chinese)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-arphic-gbsn00lp
          test -r /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          test -r /usr/share/fonts/truetype/arphic-gbsn00lp/gbsn00lp.ttf
      - name: Build and run JUnit + PostgreSQL Testcontainers
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: Require 166 real Java XLSX PostgreSQL and revision case proofs
        run: python3 backend/scripts/verify_fin_be_r1_evidence.py
      - name: Require FIN-BE-R1-X0 four-language catalog runtime proofs
        run: python3 backend/scripts/verify_fin_be_r1_x0_evidence.py
      - name: Require FIN-BE-R1-X2 populated server-issued XLSX/PostgreSQL proofs
        run: python3 backend/scripts/verify_fin_be_r1_x2_evidence.py
      - name: Require FIN-BE-R1-X3/X4 real HTML and parsed PDF output proofs
        run: python3 backend/scripts/verify_fin_be_r1_x3_x4_evidence.py
      - name: Reject forged or mismatched X5 evidence (independent validator tests)
        run: python3 -m unittest discover -s backend/scripts/tests -p test_fin_be_r1_x5_integrity.py
      - name: Require 1992 cross-format outputs on one immutable source revision
        run: python3 backend/scripts/verify_fin_be_r1_x5_integrity.py
      - name: Archive X5 three-format cross-integrity acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-be-r1-x5-cross-format-integrity-${{ github.job }}
          path: backend/target/fin-evidence/fin-be-r1-x-export-coverage.json
          if-no-files-found: error
          retention-days: 14
      - name: Archive 166x4 HTML/PDF render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-be-r1-x3-x4-render-coverage-${{ github.job }}
          path: backend/target/fin-evidence/fin-be-r1-x3-x4-render-coverage.json
          if-no-files-found: error
          retention-days: 14
      - name: Archive FIN-BE-R1-X2 populated Excel export evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-be-r1-x2-populated-xlsx-evidence-${{ github.job }}
          path: backend/target/fin-evidence/fin-be-r1-x2-xlsx-export-coverage.json
          if-no-files-found: error
          retention-days: 14
      - name: Archive FIN-BE-R1-X0 measured locale coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-be-r1-x0-four-language-evidence-${{ github.job }}
          path: backend/target/fin-evidence/fin-be-r1-x0-four-language-coverage.json
          if-no-files-found: error
          retention-days: 14
      - name: Archive 166-form Java/PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-be-r1-166-postgres-evidence-${{ github.job }}
          path: backend/target/fin-evidence/fin-be-r1-form-upload-coverage.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve Java diagnostic five-question test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-java-five-question-smoke
          path: |
            backend/target/surefire-reports/*ScenarioFiveQuestionEngineTest*
            backend/target/surefire-reports/*ExtensionSheetContractSmokeTest*
            backend/target/surefire-reports/*ScenarioEconomicsEngineTest*
            backend/src/test/resources/simulation/scenario-five-question-coverage.tsv
          if-no-files-found: warn
          retention-days: 14
