name: FIN CALC-3C.1 — Numeric Source PostgreSQL 16

on:
  push:
    branches:
      - feat/fin-form-library-standalone
    paths:
      - 'form-library/src/main/resources/db/changelog/037-fin-calc3c1-numeric-source-capabilities-postgresql.sql'
      - 'form-library/src/main/resources/db/changelog/db.changelog-master.yaml'
      - 'form-library/src/main/java/kz/fin/formlib/bootstrap/Calc3C1NumericSourceBootstrap.java'
      - 'form-library/src/test/java/kz/fin/formlib/calc/hybrid/Calc3C1NumericCapabilityPostgresqlTest.java'
      - 'form-library/pom.xml'
      - '.github/workflows/fin-calc3c1-numeric-pg16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calc3c1-numeric:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: form-library/pom.xml
      - name: Execute actual PostgreSQL 16 capability qualification
        run: |
          mvn -B -ntp -f form-library/pom.xml test \
            -Dfin.postgres.uat.enabled=true \
            -Dtest=Calc3C1NumericCapabilityPostgresqlTest \
            -DfailIfNoTests=true
      - name: Strict count and skipped-test guard
        if: always()
        run: |
          python3 - <<'PY'
          import glob,sys,xml.etree.ElementTree as ET
          files=glob.glob('form-library/target/surefire-reports/TEST-*Calc3C1NumericCapabilityPostgresqlTest.xml')
          if len(files)!=1:
              sys.exit('FAIL: capability PG16 report not found')
          root=ET.parse(files[0]).getroot()
          actual={k:int(root.attrib.get(k,0)) for k in ('tests','errors','failures','skipped')}
          print(actual)
          if actual!={'tests':4,'errors':0,'failures':0,'skipped':0}:
              sys.exit('FAIL: 4/4 real PostgreSQL 16 tests required')
          PY
