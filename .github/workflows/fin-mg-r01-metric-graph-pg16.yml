name: FIN MG-R0.1 — Exact Metric Graph PG16

on:
  push:
    branches:
      - feat/fin-form-library-standalone
    paths:
      - 'form-library/src/main/java/kz/fin/formlib/calc/graph/**'
      - 'form-library/src/main/java/kz/fin/formlib/api/MetricGraphController.java'
      - 'form-library/src/main/java/kz/fin/formlib/calc/plan/Calc4DTypedDagCompiler.java'
      - 'form-library/src/main/java/kz/fin/formlib/service/IndicatorNavigatorCatalog.java'
      - 'form-library/src/test/java/kz/fin/formlib/calc/graph/**'
      - '.github/workflows/fin-mg-r01-metric-graph-pg16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graph-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: form-library/pom.xml
      - name: Resolve exact method DAG and inputs with PostgreSQL 16
        run: |
          mvn -B -ntp -f form-library/pom.xml test \
            -Dfin.postgres.uat.enabled=true \
            -Dtest=MetricGraphResolverPostgresqlTest \
            -DfailIfNoTests=true
      - name: Require five real PostgreSQL checks; none skipped
        run: |
          python3 - <<'PY'
          import glob,sys,xml.etree.ElementTree as ET
          paths=glob.glob('form-library/target/surefire-reports/TEST-*MetricGraphResolverPostgresqlTest.xml')
          if len(paths)!=1:sys.exit('MG_R01_REPORT_MISSING')
          r=ET.parse(paths[0]).getroot()
          metrics={k:int(r.attrib.get(k,0)) for k in
                   ('tests','errors','failures','skipped')}
          print(metrics)
          if metrics!={'tests':5,'errors':0,'failures':0,'skipped':0}:
              sys.exit('MG_R01_POSTGRESQL_NOT_GREEN')
          PY
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-mg-r01-pg16
          path: form-library/target/surefire-reports/TEST-*MetricGraphResolverPostgresqlTest.xml
          if-no-files-found: warn
