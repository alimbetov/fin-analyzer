name: FIN CALC-APPS-R0 — Six Application Contracts PG16

on:
  push:
    branches:
      - feat/fin-form-library-standalone
    paths:
      - 'form-library/src/main/resources/db/changelog/054-fin-calc154-six-application-contracts-postgresql.sql'
      - 'form-library/src/main/resources/db/changelog/db.changelog-master.yaml'
      - 'form-library/src/main/java/kz/fin/formlib/calc/methodology/CalcApplicationContractRegistry.java'
      - 'form-library/src/test/java/kz/fin/formlib/calc/methodology/CalcApplicationContractPostgresqlTest.java'
      - '.github/workflows/fin-calc154-six-app-contracts-pg16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calc-apps-r0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: form-library/pom.xml
      - name: Run exact PG16 contract tests with Liquibase and Java bootstrap
        run: |
          mvn -B -ntp -f form-library/pom.xml test \
            -Dfin.postgres.uat.enabled=true \
            -Dtest=CalcApplicationContractPostgresqlTest \
            -DfailIfNoTests=true
      - name: Require all 4 tests without skipping
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files=glob.glob('form-library/target/surefire-reports/TEST-*CalcApplicationContractPostgresqlTest.xml')
          if len(files)!=1:sys.exit('CALC_APPS_R0_REPORT_MISSING')
          root=ET.parse(files[0]).getroot()
          stats={k:int(root.attrib.get(k,0)) for k in ('tests','errors','failures','skipped')}
          print(stats)
          if stats != {'tests':4,'errors':0,'failures':0,'skipped':0}:
            sys.exit('CALC_APPS_R0_PG16_NOT_GREEN')
          PY
