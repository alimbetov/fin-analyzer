name: FIN CALC-154 — Formula Contract PG16 Gate

on:
  push:
    branches:
      - feat/fin-form-library-standalone
    paths:
      - 'form-library/src/main/resources/db/changelog/035-fin-calc154-versioned-formula-contracts-postgresql.sql'
      - 'form-library/src/main/resources/db/changelog/db.changelog-master.yaml'
      - 'form-library/src/main/resources/catalog/calc154-formula-contracts-v1.tsv'
      - 'form-library/src/main/java/kz/fin/formlib/bootstrap/Calc154FormulaContractBootstrap.java'
      - 'form-library/src/main/java/kz/fin/formlib/bootstrap/Calc154CandidateOperationBootstrap.java'
      - 'form-library/src/test/java/kz/fin/formlib/calc/hybrid/Calc154FormulaContractPostgresqlTest.java'
      - '.github/workflows/fin-calc154-formula-contract-pg16.yml'
      - 'form-library/pom.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: form-library/pom.xml
      - name: Run exact PostgreSQL 16 formula-contract tests
        run: |
          mvn -B -ntp -f form-library/pom.xml test \
            -Dfin.postgres.uat.enabled=true \
            -Dtest=Calc154FormulaContractPostgresqlTest \
            -DfailIfNoTests=true
      - name: Reject silent skip and partial acceptance
        if: always()
        run: |
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as ET,sys
          p=glob.glob('form-library/target/surefire-reports/TEST-*Calc154FormulaContractPostgresqlTest.xml')
          if len(p)!=1:
              sys.exit('FAIL: CALC154 formula PG16 report missing')
          x=ET.parse(p[0]).getroot()
          actual={n:int(x.attrib.get(n,0)) for n in ('tests','errors','failures','skipped')}
          print(actual)
          if actual!={'tests':4,'errors':0,'failures':0,'skipped':0}:
              sys.exit('FAIL: expected 4 PG16 formula-contract passes, no skips')
          PY
