name: FIN CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Sector pilot kernel and five-question diagnostic smoke tests
        run: npm --prefix packages/sector-pilot test
      - name: Generate 166-form / 30-sheet smoke matrix
        run: |
          mkdir -p test-results
          node packages/sector-pilot/src/smoke-cli.mjs > test-results/fin-form-smoke-matrix.json
      - name: Upload FIN diagnostic form smoke matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-diagnostic-smoke-matrix
          path: test-results/fin-form-smoke-matrix.json
          if-no-files-found: warn
          retention-days: 14
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser E2E (Linux Chromium)
        run: npm run test:e2e -- --project=chromium

  desktop-macos:
    # macOS runners provide desktop browser evidence, not a manual UAT approval.
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install desktop browsers
        run: npx playwright install chromium webkit
      - name: Desktop browser UAT (macOS Chromium + WebKit)
        run: npm run test:e2e -- --project=chromium --project=webkit
      - name: Preserve UI screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-macos-desktop-uat
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  backend-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: JUnit 5 and PostgreSQL Testcontainers (real Docker)
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: Fail closed if diagnostic or PostgreSQL integration test evidence is missing
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          reports=backend/target/surefire-reports
          for klass in \
            kz.fin.backend.diagnostics.ScenarioFiveQuestionEngineTest \
            kz.fin.backend.diagnostics.ExtensionSheetContractSmokeTest \
            kz.fin.backend.diagnostics.ScenarioEconomicsEngineTest \
            kz.fin.backend.persistence.PostgresInvariantTest \
            kz.fin.backend.persistence.FactPublicationIntegrationTest \
            kz.fin.backend.persistence.TrustedFinancialPopulationIntegrationTest \
            kz.fin.backend.persistence.TrustedFinancialFormMapperIntegrationTest \
            kz.fin.backend.diagnostics.R4ProofAndDecisionTest; do
            file="$reports/TEST-$klass.xml"
            test -s "$file" || { echo "::error::Missing mandatory JUnit report $file"; exit 1; }
          done
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          classes = [
              "kz.fin.backend.diagnostics.ScenarioFiveQuestionEngineTest",
              "kz.fin.backend.diagnostics.ExtensionSheetContractSmokeTest",
              "kz.fin.backend.diagnostics.ScenarioEconomicsEngineTest",
              "kz.fin.backend.persistence.PostgresInvariantTest",
              "kz.fin.backend.persistence.FactPublicationIntegrationTest",
              "kz.fin.backend.persistence.TrustedFinancialPopulationIntegrationTest",
              "kz.fin.backend.persistence.TrustedFinancialFormMapperIntegrationTest",
              "kz.fin.backend.diagnostics.R4ProofAndDecisionTest",
          ]
          for classname in classes:
              report = Path("backend/target/surefire-reports") / f"TEST-{classname}.xml"
              suite = ET.parse(report).getroot()
              tests = int(suite.get("tests", "0"))
              failures = int(suite.get("failures", "0"))
              errors = int(suite.get("errors", "0"))
              skipped = int(suite.get("skipped", "0"))
              if tests == 0 or failures or errors or skipped:
                  raise SystemExit(
                      f"REQUIRED_JUNIT_NOT_GREEN {classname}: "
                      f"tests={tests} failures={failures} errors={errors} skipped={skipped}"
                  )
              print(f"REQUIRED_JUNIT_GREEN {classname} tests={tests}")
          PY
      - name: Upload backend evidence for this commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-backend-golden-and-postgres-evidence
          path: |
            backend/target/surefire-reports/
            backend/src/test/resources/simulation/scenario-five-question-coverage.tsv
          if-no-files-found: error
          retention-days: 14

  acceptance-gate:
    if: always()
    needs: [verify, backend-verification, desktop-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Require all mandatory jobs on exactly this workflow SHA
        shell: bash
        env:
          NODE_STATUS: ${{ needs.verify.result }}
          BACKEND_STATUS: ${{ needs.backend-verification.result }}
          DESKTOP_STATUS: ${{ needs.desktop-macos.result }}
          TRIGGER: ${{ github.event_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          echo "Acceptance workflow SHA: $GITHUB_SHA"
          echo "PR head / push SHA: $EVENT_HEAD_SHA"
          {
            echo "## FIN diagnostic acceptance"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Event | \`$TRIGGER\` |"
            echo "| Workflow SHA | \`$GITHUB_SHA\` |"
            echo "| PR head/push SHA | \`$EVENT_HEAD_SHA\` |"
            echo "| Node / browser | \`$NODE_STATUS\` |"
            echo "| Java / PostgreSQL | \`$BACKEND_STATUS\` |"
            echo "| macOS browsers | \`$DESKTOP_STATUS\` |"
            echo ""
            echo "Production readiness requires S2 review and trusted React/PostgreSQL E2E separately."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Node / Playwright: $NODE_STATUS"
          echo "Java / PostgreSQL: $BACKEND_STATUS"
          echo "macOS desktop browsers: $DESKTOP_STATUS"
          test "$NODE_STATUS" = "success"
          test "$BACKEND_STATUS" = "success"
          test "$DESKTOP_STATUS" = "success"
          echo "CI_ACCEPTANCE_GREEN_SHA=$GITHUB_SHA"
