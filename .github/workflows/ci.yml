name: FIN CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  # Cancel outdated feature-branch runs; do not cancel main / PR / manual checks.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/fin-r0-r1a' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: FIN-R8 Flyway version preflight (including negative tests)
        run: |
          node --test scripts/check-flyway-versions.test.mjs
          node scripts/check-flyway-versions.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: P0 source-backed delivery contract and negative guards (not S2 or production acceptance)
        run: |
          node --test scripts/fin-p0-contract.test.mjs
          node scripts/fin-p0-contract-check.mjs --evidence
      - name: Archive P0 static contract proof (not CI GREEN)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-p0-static-contract
          path: test-results/fin-p0-static-contract.json
          if-no-files-found: warn
          retention-days: 14
      - name: Typecheck
        run: npm run typecheck
      - name: Sector pilot kernel and five-question diagnostic smoke tests
        run: npm --prefix packages/sector-pilot test
      - name: Generate 166-form / 30-sheet smoke matrix
        run: |
          mkdir -p test-results
          node packages/sector-pilot/src/smoke-cli.mjs > test-results/fin-form-smoke-matrix.json
      - name: Upload FIN diagnostic form smoke matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-diagnostic-smoke-matrix
          path: test-results/fin-form-smoke-matrix.json
          if-no-files-found: warn
          retention-days: 14
      - name: Unit tests
        run: npm test
      - name: Require exhaustive template smoke manifest before build
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const f = JSON.parse(fs.readFileSync("test-results/fin-template-transfer-smoke.json", "utf8"));
            if (f.schemaVersion !== "FIN_TEMPLATE_TRANSFER_SMOKE_V1" ||
                f.verifiedFormCount !== 154 ||
                f.exercisedFieldCoordinates !== 794 ||
                f.periodLocaleScaleVariants !== 3 ||
                Object.keys(f.coverage).length !== 154 ||
                Object.values(f.coverage).some(x => x.variants.length !== 3))
              throw new Error("FIN_TEMPLATE_TRANSFER_COVERAGE_INCOMPLETE");
            console.log("FIN_TEMPLATE_TRANSFER_READY_FOR_S2: 154 forms / 794 fields / 3 contexts; no publication");
          '
      - name: Preserve exhaustive template-transfer smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-template-transfer-154-pre-save
          path: test-results/fin-template-transfer-smoke.json
          if-no-files-found: error
          retention-days: 14
      - name: Production build
        run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser E2E (Linux Chromium)
        run: npm run test:e2e -- --project=chromium

  desktop-macos:
    # macOS runners provide desktop browser evidence, not a manual UAT approval.
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install desktop browsers
        run: npx playwright install chromium webkit
      - name: Desktop browser UAT (macOS Chromium + WebKit)
        run: npm run test:e2e -- --project=chromium --project=webkit
      - name: Preserve UI screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-macos-desktop-uat
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  backend-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: FIN-R8 Flyway version preflight
        run: |
          node --test scripts/check-flyway-versions.test.mjs
          node scripts/check-flyway-versions.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Provision offline PDF renderer fonts (Latin, Kazakh, Simplified Chinese)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-arphic-gbsn00lp
          test -r /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          test -r /usr/share/fonts/truetype/arphic-gbsn00lp/gbsn00lp.ttf
      - name: JUnit 5 and PostgreSQL Testcontainers (real Docker)
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: Require 166 real Java XLSX PostgreSQL and revision case proofs
        run: python3 backend/scripts/verify_fin_be_r1_evidence.py
      - name: Require FIN-BE-R1-X0 four-language catalog runtime proofs
        run: python3 backend/scripts/verify_fin_be_r1_x0_evidence.py
      - name: Require FIN-BE-R1-X2 populated server-issued XLSX/PostgreSQL proofs
        run: python3 backend/scripts/verify_fin_be_r1_x2_evidence.py
      - name: Require FIN-BE-R1-X3/X4 real HTML and parsed PDF output proofs
        run: python3 backend/scripts/verify_fin_be_r1_x3_x4_evidence.py
      - name: Reject forged or mismatched X5 evidence (independent validator tests)
        run: python3 -m unittest discover -s backend/scripts/tests -p test_fin_be_r1_x5_integrity.py
      - name: Require 1992 cross-format outputs on one immutable source revision
        run: python3 backend/scripts/verify_fin_be_r1_x5_integrity.py
      - name: Archive X5 three-format cross-integrity acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-be-r1-x5-cross-format-integrity-${{ github.job }}
          path: backend/target/fin-evidence/fin-be-r1-x-export-coverage.json
          if-no-files-found: error
          retention-days: 14
      - name: Archive 166x4 HTML/PDF render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-be-r1-x3-x4-render-coverage-${{ github.job }}
          path: backend/target/fin-evidence/fin-be-r1-x3-x4-render-coverage.json
          if-no-files-found: error
          retention-days: 14
      - name: Archive FIN-BE-R1-X2 populated Excel export evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-be-r1-x2-populated-xlsx-evidence-${{ github.job }}
          path: backend/target/fin-evidence/fin-be-r1-x2-xlsx-export-coverage.json
          if-no-files-found: error
          retention-days: 14
      - name: Archive FIN-BE-R1-X0 measured locale coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-be-r1-x0-four-language-evidence-${{ github.job }}
          path: backend/target/fin-evidence/fin-be-r1-x0-four-language-coverage.json
          if-no-files-found: error
          retention-days: 14
      - name: Archive 166-form Java/PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-be-r1-166-postgres-evidence-${{ github.job }}
          path: backend/target/fin-evidence/fin-be-r1-form-upload-coverage.json
          if-no-files-found: error
          retention-days: 14
      - name: Fail closed if diagnostic or PostgreSQL integration test evidence is missing
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          reports=backend/target/surefire-reports
          for klass in \
            kz.fin.backend.diagnostics.ScenarioFiveQuestionEngineTest \
            kz.fin.backend.diagnostics.ExtensionSheetContractSmokeTest \
            kz.fin.backend.diagnostics.ScenarioEconomicsEngineTest \
            kz.fin.backend.persistence.PostgresInvariantTest \
            kz.fin.backend.persistence.FlywayMigrationRecoveryIntegrationTest \
            kz.fin.backend.persistence.FactPublicationIntegrationTest \
            kz.fin.backend.persistence.TrustedBusinessDiagnosticIntegrationTest \
            kz.fin.backend.execution.ExecutionContractsTest \
            kz.fin.backend.execution.SingleExecutorGraphTest \
            kz.fin.backend.execution.MethodologyCatalogContractTest \
            kz.fin.backend.execution.QualifiedRevenueSingleExecutorIntegrationTest \
            kz.fin.backend.execution.QualifiedRevenueStructureIntegrationTest \
            kz.fin.backend.execution.QualifiedCurrentRatioIntegrationTest \
            kz.fin.backend.execution.QualifiedCurrentRatioFeatureGateTest \
            kz.fin.backend.analytics.ConcentrationAnalysisEngineTest \
            kz.fin.backend.analytics.OperatingFinanceMethodEngineTest \
            kz.fin.backend.execution.ReviewedSkuSingleExecutorIntegrationTest \
            kz.fin.backend.execution.QualifiedSkuConcentrationFeatureGateTest \
            kz.fin.backend.persistence.TrustedFinancialPopulationIntegrationTest \
            kz.fin.backend.persistence.TrustedFinancialFormMapperIntegrationTest \
            kz.fin.backend.diagnostics.R4ProofAndDecisionTest \
            kz.fin.backend.diagnostics.DecisionOutcomeMonitorTest \
            kz.fin.backend.diagnostics.IndicatorRelationshipRegistryTest \
            kz.fin.backend.security.FinanceAccessPolicyTest \
            kz.fin.backend.api.FinancialApiSecurityIntegrationTest \
            kz.fin.backend.api.FormV5MultiUserRefreshIntegrationTest \
            kz.fin.backend.api.FinancialApiDisabledIntegrationTest \
            kz.fin.backend.persistence.ReviewedFinancialIntakeIntegrationTest \
            kz.fin.backend.persistence.PilotXlsxIntakeIntegrationTest \
            kz.fin.backend.persistence.PilotXlsxStructuralTransferTest \
            kz.fin.backend.persistence.ActualProvisionalCrossFormIntegrationTest \
            kz.fin.backend.intake.FormSchemaV5Test \
            kz.fin.backend.intake.CatalogCaptureRegistryTest \
            kz.fin.backend.intake.SpecializedSchemaCandidateRegistryTest \
            kz.fin.backend.intake.FormDraftRevisionV5IntegrationTest \
            kz.fin.backend.diagnostics.CrossFormDiagnosticEngineTest \
            kz.fin.backend.diagnostics.CrossFormEvidencePlannerTest \
            kz.fin.backend.persistence.TrustedCrossFormDiagnosticIntegrationTest; do
            file="$reports/TEST-$klass.xml"
            test -s "$file" || { echo "::error::Missing mandatory JUnit report $file"; exit 1; }
          done
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          classes = [
              "kz.fin.backend.diagnostics.ScenarioFiveQuestionEngineTest",
              "kz.fin.backend.diagnostics.ExtensionSheetContractSmokeTest",
              "kz.fin.backend.diagnostics.ScenarioEconomicsEngineTest",
              "kz.fin.backend.persistence.PostgresInvariantTest",
              "kz.fin.backend.persistence.FlywayMigrationRecoveryIntegrationTest",
              "kz.fin.backend.persistence.FactPublicationIntegrationTest",
              "kz.fin.backend.persistence.TrustedBusinessDiagnosticIntegrationTest",
              "kz.fin.backend.execution.ExecutionContractsTest",
              "kz.fin.backend.execution.SingleExecutorGraphTest",
              "kz.fin.backend.execution.MethodologyCatalogContractTest",
              "kz.fin.backend.execution.QualifiedRevenueSingleExecutorIntegrationTest",
              "kz.fin.backend.execution.QualifiedRevenueStructureIntegrationTest",
              "kz.fin.backend.execution.QualifiedCurrentRatioIntegrationTest",
              "kz.fin.backend.execution.QualifiedCurrentRatioFeatureGateTest",
              "kz.fin.backend.analytics.ConcentrationAnalysisEngineTest",
              "kz.fin.backend.analytics.OperatingFinanceMethodEngineTest",
              "kz.fin.backend.execution.ReviewedSkuSingleExecutorIntegrationTest",
              "kz.fin.backend.execution.QualifiedSkuConcentrationFeatureGateTest",
              "kz.fin.backend.persistence.TrustedFinancialPopulationIntegrationTest",
              "kz.fin.backend.persistence.TrustedFinancialFormMapperIntegrationTest",
              "kz.fin.backend.diagnostics.R4ProofAndDecisionTest",
              "kz.fin.backend.diagnostics.DecisionOutcomeMonitorTest",
              "kz.fin.backend.diagnostics.IndicatorRelationshipRegistryTest",
              "kz.fin.backend.security.FinanceAccessPolicyTest",
              "kz.fin.backend.api.FinancialApiSecurityIntegrationTest",
              "kz.fin.backend.api.FormV5MultiUserRefreshIntegrationTest",
              "kz.fin.backend.api.FinancialApiDisabledIntegrationTest",
              "kz.fin.backend.persistence.ReviewedFinancialIntakeIntegrationTest",
              "kz.fin.backend.persistence.PilotXlsxIntakeIntegrationTest",
              "kz.fin.backend.persistence.PilotXlsxStructuralTransferTest",
              "kz.fin.backend.persistence.ActualProvisionalCrossFormIntegrationTest",
              "kz.fin.backend.intake.FormSchemaV5Test",
              "kz.fin.backend.intake.CatalogCaptureRegistryTest",
              "kz.fin.backend.intake.SpecializedSchemaCandidateRegistryTest",
              "kz.fin.backend.intake.FormDraftRevisionV5IntegrationTest",
              "kz.fin.backend.diagnostics.CrossFormDiagnosticEngineTest",
              "kz.fin.backend.diagnostics.CrossFormEvidencePlannerTest",
              "kz.fin.backend.persistence.TrustedCrossFormDiagnosticIntegrationTest",
          ]
          for classname in classes:
              report = Path("backend/target/surefire-reports") / f"TEST-{classname}.xml"
              suite = ET.parse(report).getroot()
              tests = int(suite.get("tests", "0"))
              failures = int(suite.get("failures", "0"))
              errors = int(suite.get("errors", "0"))
              skipped = int(suite.get("skipped", "0"))
              if tests == 0 or failures or errors or skipped:
                  raise SystemExit(
                      f"REQUIRED_JUNIT_NOT_GREEN {classname}: "
                      f"tests={tests} failures={failures} errors={errors} skipped={skipped}"
                  )
              print(f"REQUIRED_JUNIT_GREEN {classname} tests={tests}")
          PY
      - name: Upload backend evidence for this commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-backend-golden-and-postgres-evidence
          path: |
            backend/target/surefire-reports/
            backend/src/test/resources/simulation/scenario-five-question-coverage.tsv
          if-no-files-found: error
          retention-days: 14

  acceptance-gate:
    if: always()
    needs: [verify, backend-verification, desktop-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Require all mandatory jobs on exactly this workflow SHA
        shell: bash
        env:
          NODE_STATUS: ${{ needs.verify.result }}
          BACKEND_STATUS: ${{ needs.backend-verification.result }}
          DESKTOP_STATUS: ${{ needs.desktop-macos.result }}
          TRIGGER: ${{ github.event_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          echo "Acceptance workflow SHA: $GITHUB_SHA"
          echo "PR head / push SHA: $EVENT_HEAD_SHA"
          {
            echo "## FIN diagnostic acceptance"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Event | \`$TRIGGER\` |"
            echo "| Workflow SHA | \`$GITHUB_SHA\` |"
            echo "| PR head/push SHA | \`$EVENT_HEAD_SHA\` |"
            echo "| Node / browser | \`$NODE_STATUS\` |"
            echo "| Java / PostgreSQL | \`$BACKEND_STATUS\` |"
            echo "| macOS browsers | \`$DESKTOP_STATUS\` |"
            echo ""
            echo "Production readiness requires S2 review and trusted React/PostgreSQL E2E separately."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Node / Playwright: $NODE_STATUS"
          echo "Java / PostgreSQL: $BACKEND_STATUS"
          echo "macOS desktop browsers: $DESKTOP_STATUS"
          test "$NODE_STATUS" = "success"
          test "$BACKEND_STATUS" = "success"
          test "$DESKTOP_STATUS" = "success"
          echo "CI_ACCEPTANCE_GREEN_SHA=$GITHUB_SHA"
