name: FIN CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Sector pilot kernel and five-question diagnostic smoke tests
        run: npm --prefix packages/sector-pilot test
      - name: Generate 166-form / 30-sheet smoke matrix
        run: |
          mkdir -p test-results
          node packages/sector-pilot/src/smoke-cli.mjs > test-results/fin-form-smoke-matrix.json
      - name: Upload FIN diagnostic form smoke matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-diagnostic-smoke-matrix
          path: test-results/fin-form-smoke-matrix.json
          if-no-files-found: warn
          retention-days: 14
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser E2E (Linux Chromium)
        run: npm run test:e2e -- --project=chromium

  desktop-macos:
    # macOS runners provide desktop browser evidence, not a manual UAT approval.
    if: github.event_name == 'push'
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install desktop browsers
        run: npx playwright install chromium webkit
      - name: Desktop browser UAT (macOS Chromium + WebKit)
        run: npm run test:e2e -- --project=chromium --project=webkit
      - name: Preserve UI screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-macos-desktop-uat
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
