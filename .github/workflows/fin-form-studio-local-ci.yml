name: FIN Form Studio — React and Backend Regression

on:
  push:
    branches:
      - feat/fin-form-library-standalone
    paths:
      - frontend/**
      - form-library/**
      - compose.local.yml
      - scripts/**
      - .github/workflows/fin-form-studio-local-ci.yml
      - .github/workflows/fin-ux-r11-browser-e2e.yml
  pull_request:
    paths:
      - frontend/**
      - form-library/**
      - compose.local.yml
      - scripts/**
      - .github/workflows/fin-form-studio-local-ci.yml
      - .github/workflows/fin-ux-r11-browser-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-inventory:
    name: FIN-EDIT-R1 source contract inventory (166 forms)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Audit source coverage without implicit S2 approval
        run: python3 scripts/audit-fin-r1-contracts.py --out-dir target/fin-r1
      - uses: actions/upload-artifact@v4
        with:
          name: fin-r1-unqualified-contract-matrix
          path: |
            target/fin-r1/form-contract-audit.json
            target/fin-r1/form-contract-matrix.csv
            target/fin-r1/field-metric-contract-matrix.csv

  frontend:
    name: React typecheck, clipboard tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript and Excel paste regression
        run: npm run check

  backend:
    name: Spring Boot / REST / H2 regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: form-library/pom.xml
      - name: Backend regression and Liquibase smoke (test datasource)
        run: mvn -B -ntp -f form-library/pom.xml clean verify

  # INGEST-2 source SHA and FACT-0 PostgreSQL partition/storage gates.
  # FACT-0 fixtures and FACT-1 synthetic F02 qualifier are TEST-ONLY,
  # NOT independent financial S2 approval or production publication.

  postgres-qualification:
    name: PostgreSQL 16 / fin_intake REST qualification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: form-library/pom.xml
      - name: Reject mixed Testcontainers module versions
        shell: bash
        run: |
          mvn -B -ntp -f form-library/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.7.1:tree -Dincludes=org.testcontainers -DoutputFile=target/testcontainers-tree.txt
          cat form-library/target/testcontainers-tree.txt
          if grep -E 'org[.]testcontainers:.*:1[.]21[.]3' form-library/target/testcontainers-tree.txt; then
            echo "Mixed Testcontainers versions detected: 1.21.3 must not be present"
            exit 1
          fi
          grep -E 'org[.]testcontainers:testcontainers:jar:1[.]21[.]4' form-library/target/testcontainers-tree.txt
      - name: Run isolated PostgreSQL Testcontainers integration
        run: >-
          mvn -B -ntp -f form-library/pom.xml
          -Dtest=ReactLocalPostgresIntegrationTest,R16BPostgresqlContractTest,Ingest2PostgresqlIntegrityTest,FactR0PostgresqlPartitionTest,Fact1F02TestOnlyQualificationTest,Fact1BUatCommitterPostgresqlTest,CalcR01PostgresqlTest,CalcR02PostgresqlTest,Calc166ReadinessPostgresqlTest,FactR0PostgresqlUpgradeTest
          -Dfin.postgres.uat.enabled=true
          test
      - name: Fail closed on FACT-1.B PG16 source/commit/replay matrix
        run: python3 scripts/check-fin-fact1b-junit.py --out-dir target/fin-fact1b
      - name: Fail closed on CALC-R0.1 PostgreSQL TX-B matrix
        run: python3 scripts/check-fin-calc-r01-junit.py --out-dir target/calc-r01
      - name: Fail closed on CALC-R0.2 PostgreSQL full E2E
        run: python3 scripts/check-fin-calc-r02-junit.py --out-dir target/calc-r02
      - name: Fail closed on 166 separate PostgreSQL calculation readiness checks
        run: python3 scripts/check-fin-calc166-junit.py --out-dir form-library/target/fin-calc166
      - name: Validate exactly 166 independently executed PG16 report cases
        run: python3 scripts/check-fin-166-form-junit.py --out-dir target/fin-166
      - name: Preserve JUnit evidence for each of 166 report forms
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-166-form-pg16-junit
          path: |
            form-library/target/surefire-reports/TEST-kz.fin.formlib.calc.ingest.Ingest2PostgresqlIntegrityTest.xml
            target/fin-166/form-coverage.csv
            target/fin-166/form-coverage.json
            form-library/target/surefire-reports/TEST-kz.fin.formlib.calc.fact.Fact1BUatCommitterPostgresqlTest.xml
            target/fin-fact1b/fact1b-coverage.json
            form-library/target/surefire-reports/TEST-kz.fin.formlib.calc.fact.CalcR01PostgresqlTest.xml
            target/calc-r01/calc-r01-coverage.json
            form-library/target/surefire-reports/TEST-kz.fin.formlib.calc.worker.CalcR02PostgresqlTest.xml
            target/calc-r02/calc-r02-coverage.json
            form-library/target/surefire-reports/TEST-kz.fin.formlib.calc.readiness.Calc166ReadinessPostgresqlTest.xml
            form-library/target/fin-calc166/166-form-calculation-readiness.tsv
            form-library/target/fin-calc166/877-field-calculation-contracts.tsv
            form-library/target/fin-calc166/coverage-check.json
          if-no-files-found: error
          retention-days: 30

  powershell-smoke-syntax:
    name: PowerShell 7 smoke script parser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate local smoke script syntax without running financial writes
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './scripts/smoke-local.ps1').Path,
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List -Force
            exit 1
          }
          Write-Host 'PowerShell smoke script syntax PASS'

  browser-qualification:
    name: FIN-FORMS-QA-R2 Chromium 166-form qualification
    uses: ./.github/workflows/fin-ux-r11-browser-e2e.yml

  forms-release-gate:
    name: FIN-FORMS-QA-R2 release gate
    if: ${{ always() }}
    needs:
      - contract-inventory
      - frontend
      - backend
      - postgres-qualification
      - powershell-smoke-syntax
      - browser-qualification
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fail closed on any missing, failed or skipped mandatory qualification
        env:
          CONTRACT: ${{ needs.contract-inventory.result }}
          FRONTEND: ${{ needs.frontend.result }}
          BACKEND: ${{ needs.backend.result }}
          POSTGRES: ${{ needs.postgres-qualification.result }}
          POWERSHELL: ${{ needs.powershell-smoke-syntax.result }}
          BROWSER: ${{ needs.browser-qualification.result }}
        run: |
          for value in "$CONTRACT" "$FRONTEND" "$BACKEND" "$POSTGRES" "$POWERSHELL" "$BROWSER"; do
            if [ "$value" != "success" ]; then
              echo "[FAIL] FIN-FORMS-QA-R2 gate result=$value"
              exit 1
            fi
          done
          echo "[PASS] FIN-FORMS-QA-R2 CI release qualification (NOT financial S2)"
