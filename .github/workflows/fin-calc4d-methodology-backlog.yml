name: FIN CALC-4D — 154 Methodology Packets Integrity

on:
  push:
    branches:
      - feat/fin-form-library-standalone
    paths:
      - 'docs/FIN-CALC4D-154-METHODOLOGY-AUTHORING-BACKLOG.tsv'
      - 'docs/FIN-CALC-R0-COVERAGE-166-BASELINE.tsv'
      - 'docs/FIN-CALC-R0-FIELD-COVERAGE-794-BASELINE.tsv'
      - 'docs/FIN-CALC154-METRIC-COVERAGE.tsv'
      - 'docs/FIN-CALC154-MODEL-OUTPUT-COVERAGE.tsv'
      - 'scripts/verify-fin-calc4d-154-methodology-backlog.py'
      - 'docs/FIN-CALC154-METHODOLOGY-OPERATION-GAPS.tsv'
      - 'scripts/generate-fin-calc154-methodology-operation-gaps.py'
      - '.github/workflows/fin-calc4d-methodology-backlog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-154-exact-methodology-packets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify all 154 exact form-specific authoring packets and finance HOLD
        run: |
          python3 scripts/verify-fin-calc4d-154-methodology-backlog.py
          python3 scripts/generate-fin-calc154-methodology-operation-gaps.py --check
      - name: Publish methodology authoring backlog as data artifact
        uses: actions/upload-artifact@v4
        with:
          name: fin-calc4d-154-methodology-authoring-backlog
          path: |
            docs/FIN-CALC4D-154-METHODOLOGY-AUTHORING-BACKLOG.tsv
            docs/FIN-CALC154-METHODOLOGY-OPERATION-GAPS.tsv
          if-no-files-found: error
          retention-days: 30
