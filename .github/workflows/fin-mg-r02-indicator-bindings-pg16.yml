name: FIN MG-R0.2 — Explicit Goal Indicator PG16

on:
  push:
    branches:
      - feat/fin-form-library-standalone
    paths:
      - 'form-library/src/main/java/kz/fin/formlib/calc/graph/**'
      - 'form-library/src/main/java/kz/fin/formlib/api/MetricIndicatorBindingController.java'
      - 'form-library/src/main/resources/db/changelog/057-fin-mg-r02-explicit-indicator-bindings-postgresql.sql'
      - 'form-library/src/main/resources/db/changelog/db.changelog-master.yaml'
      - 'form-library/src/test/java/kz/fin/formlib/calc/graph/MetricIndicatorBindingPostgresqlTest.java'
      - '.github/workflows/fin-mg-r02-indicator-bindings-pg16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metric-indicator-links:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: form-library/pom.xml
      - name: Verify pinned editorial goal/indicator links in PostgreSQL 16
        run: |
          mvn -B -ntp -f form-library/pom.xml test \
            -Dfin.postgres.uat.enabled=true \
            -Dtest=MetricIndicatorBindingPostgresqlTest \
            -DfailIfNoTests=true
      - name: Require five verified source mapping scenarios
        run: |
          python3 - <<'PY'
          import sys,glob,xml.etree.ElementTree as ET
          files=glob.glob('form-library/target/surefire-reports/TEST-*MetricIndicatorBindingPostgresqlTest.xml')
          if len(files)!=1:sys.exit('MG_R02_TEST_REPORT_MISSING')
          root=ET.parse(files[0]).getroot()
          counts={key:int(root.attrib.get(key,0)) for key in
            ('tests','errors','failures','skipped')}
          print(counts)
          if counts!={'tests':5,'errors':0,'failures':0,'skipped':0}:
            sys.exit('MG_R02_ACCEPTANCE_NOT_GREEN')
          PY
      - name: Preserve JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-mg-r02-pg16
          path: form-library/target/surefire-reports/TEST-*MetricIndicatorBindingPostgresqlTest.xml
          if-no-files-found: warn
