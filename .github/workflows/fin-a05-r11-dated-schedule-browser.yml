name: FIN CALC-A05-R1.1 — Real Chromium Dated Schedule E2E

on:
  push:
    branches:
      - feat/fin-form-library-standalone
    paths:
      - 'frontend/src/App.tsx'
      - 'frontend/src/LoanContractStudio.tsx'
      - 'frontend/src/LoanSchedulePanel.tsx'
      - 'frontend/src/api.ts'
      - 'frontend/src/styles.css'
      - 'frontend/e2e/a05-dated-schedule-uat.spec.ts'
      - 'form-library/src/main/java/kz/fin/formlib/calc/loan/**'
      - 'form-library/src/main/java/kz/fin/formlib/api/LoanScheduleUatController.java'
      - 'form-library/src/main/resources/db/changelog/059-fin-calc-a05-r11-schedules-postgresql.sql'
      - 'form-library/src/main/resources/db/changelog/060-fin-calc-a05-r11-pin-trigger-fix-postgresql.sql'
      - 'form-library/src/main/resources/db/changelog/db.changelog-master.yaml'
      - '.github/maven-central-gcs-uat-settings.xml'
      - '.github/workflows/fin-a05-r11-dated-schedule-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a05-dated-schedule-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fin_form_library
          POSTGRES_USER: fin
          POSTGRES_PASSWORD: fin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fin -d fin_form_library"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: 'true'
      FIN_FORM_DB_URL: jdbc:postgresql://127.0.0.1:5432/fin_form_library
      FIN_FORM_DB_DRIVER: org.postgresql.Driver
      FIN_FORM_DB_USER: fin
      FIN_FORM_DB_PASSWORD: fin
      FIN_FORM_UAT_EDITOR_ENABLED: 'false'
      FIN_CALC_A05_INTAKE_UAT_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: form-library/pom.xml

      - name: Build dated A05 loan schedule engine
        run: mvn -s .github/maven-central-gcs-uat-settings.xml -B -ntp -f form-library/pom.xml -DskipTests package

      - name: Start isolated real PostgreSQL backend
        shell: bash
        run: |
          nohup java -Dfin.calc.a05-intake-uat.enabled=true -jar form-library/target/fin-form-library-0.1.0-SNAPSHOT.jar \
            > /tmp/fin-a05-r11-backend.log 2>&1 &
          echo $! > /tmp/fin-a05-r11-backend.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent \
              'http://127.0.0.1:8086/api/v1/catalog/navigation?locale=ru' > /dev/null; then
              echo 'FIN A05-R1.1 real PostgreSQL backend ready'
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/fin-a05-r11-backend.pid)" 2>/dev/null; then
              tail -n 120 /tmp/fin-a05-r11-backend.log
              exit 1
            fi
            sleep 2
          done
          tail -n 120 /tmp/fin-a05-r11-backend.log
          exit 1

      - name: Real Chromium dated ANNUITY and CUSTOM schedule source replay
        shell: bash
        run: |
          docker run --rm --network host --ipc host \
            -e CI=true -e HOME=/tmp -e VITE_FIN_A05_UAT=true \
            -v "$GITHUB_WORKSPACE/frontend:/work" -w /work \
            mcr.microsoft.com/playwright:v1.56.1-noble \
            bash -lc 'npm install --no-audit --no-fund && npm run test:e2e -- e2e/a05-dated-schedule-uat.spec.ts'

      - name: Require browser E2E without failure or skip
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('frontend/test-results/junit.xml').getroot()
          suites=[root] if root.tag=='testsuite' else list(root.iter('testsuite'))
          n=sum(int(x.attrib.get('tests',0)) for x in suites)
          errors=sum(int(x.attrib.get('errors',0)) for x in suites)
          failed=sum(int(x.attrib.get('failures',0)) for x in suites)
          skipped=sum(int(x.attrib.get('skipped',0)) for x in suites)
          print({'tests':n,'errors':errors,'failures':failed,'skipped':skipped})
          if n!=3 or errors or failed or skipped:raise SystemExit('FIN_A05_R11_BROWSER_E2E_NOT_GREEN')
          PY

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-a05-r11-browser
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn

      - name: Backend diagnostics on failure
        if: failure()
        run: tail -n 180 /tmp/fin-a05-r11-backend.log || true
