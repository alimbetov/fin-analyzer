name: FIN CALC-154 — Dynamic Methodology and Research PG16

on:
  push:
    branches:
      - feat/fin-form-library-standalone
    paths:
      - 'form-library/src/main/java/kz/fin/formlib/calc/methodology/**'
      - 'form-library/src/test/java/kz/fin/formlib/calc/methodology/**'
      - 'form-library/src/main/resources/db/changelog/051-*'
      - 'form-library/src/main/resources/db/changelog/052-*'
      - 'form-library/src/main/resources/db/changelog/053-*'
      - 'form-library/src/main/resources/db/changelog/db.changelog-master.yaml'
      - '.github/workflows/fin-calc154-dynamic-methodology-pg16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dynamic-methodology-pg16:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: form-library/pom.xml
      - name: Compile and execute 12 UAT math and real PostgreSQL16 tests
        run: |
          mvn -B -ntp -f form-library/pom.xml test \
            -Dfin.postgres.uat.enabled=true \
            -Dtest=FinancialMethodologyMathTest,MethodologySelectionPostgresqlTest \
            -DfailIfNoTests=true
      - name: Require 12 tests and no skipping
        run: |
          python3 - <<'PY'
          import glob,sys,xml.etree.ElementTree as ET
          report=[]
          for name in ('FinancialMethodologyMathTest',
                       'MethodologySelectionPostgresqlTest'):
            files=glob.glob('form-library/target/surefire-reports/TEST-*'+name+'.xml')
            if len(files)!=1:sys.exit('METHODOLOGY_TEST_REPORT_MISSING:'+name)
            root=ET.parse(files[0]).getroot()
            report.append({key:int(root.attrib.get(key,0))
                           for key in ('tests','failures','errors','skipped')})
          print(report)
          if sum(x['tests'] for x in report)!=12 or any(
            x[k] for x in report for k in ('failures','errors','skipped')
          ):sys.exit('METHODOLOGY_12_TEST_GATE_NOT_GREEN')
          PY
