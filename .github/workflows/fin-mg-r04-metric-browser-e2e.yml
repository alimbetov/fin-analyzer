name: FIN MG-R0.4 — Immutable Metric Graph Real Chromium

on:
  push:
    branches:
      - feat/fin-form-library-standalone
    paths:
      - 'frontend/src/App.tsx'
      - 'frontend/src/MetricGraphExecutionPanel.tsx'
      - 'frontend/src/vite-env.d.ts'
      - 'frontend/src/styles.css'
      - 'frontend/e2e/mg-r04-immutable-metric-uat.spec.ts'
      - 'form-library/src/main/java/kz/fin/formlib/calc/graph/**'
      - 'form-library/src/main/java/kz/fin/formlib/api/MetricGraphUatExecutionController.java'
      - 'form-library/src/main/resources/db/changelog/062-fin-mg-r04-immutable-uat-plans-postgresql.sql'
      - 'form-library/src/main/resources/db/changelog/db.changelog-master.yaml'
      - '.github/maven-central-gcs-uat-settings.xml'
      - '.github/workflows/fin-mg-r04-metric-browser-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metric-graph-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fin_form_library
          POSTGRES_USER: fin
          POSTGRES_PASSWORD: fin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fin -d fin_form_library"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: 'true'
      FIN_FORM_DB_URL: jdbc:postgresql://127.0.0.1:5432/fin_form_library
      FIN_FORM_DB_DRIVER: org.postgresql.Driver
      FIN_FORM_DB_USER: fin
      FIN_FORM_DB_PASSWORD: fin
      FIN_FORM_UAT_EDITOR_ENABLED: 'false'
      FIN_CALC_INTAKE_UAT_ENABLED: 'true'
      FIN_CALC_MG_R04_UAT_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: form-library/pom.xml

      - name: Build metric-led immutable UAT backend
        run: mvn -s .github/maven-central-gcs-uat-settings.xml -B -ntp -f form-library/pom.xml -DskipTests package

      - name: Start isolated real PostgreSQL backend
        shell: bash
        run: |
          nohup java -jar form-library/target/fin-form-library-0.1.0-SNAPSHOT.jar \
            > /tmp/fin-mg-r04-backend.log 2>&1 &
          echo $! > /tmp/fin-mg-r04-backend.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent \
              'http://127.0.0.1:8086/api/v1/catalog/navigation?locale=ru' > /dev/null; then
              echo 'FIN MG-R0.4 real PostgreSQL backend ready'
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/fin-mg-r04-backend.pid)" 2>/dev/null; then
              tail -n 120 /tmp/fin-mg-r04-backend.log
              exit 1
            fi
            sleep 2
          done
          tail -n 120 /tmp/fin-mg-r04-backend.log
          exit 1

      - name: Real Chromium F02 metric DAG -> exact plan -> immutable replay
        shell: bash
        run: |
          docker run --rm --network host --ipc host \
            -e CI=true -e HOME=/tmp -e VITE_FIN_INTAKE_UAT=true -e VITE_FIN_MG_R04_UAT=true \
            -v "$GITHUB_WORKSPACE/frontend:/work" -w /work \
            mcr.microsoft.com/playwright:v1.56.1-noble \
            bash -lc 'npm install --include=optional --no-audit --no-fund && npm install --no-save --no-package-lock --no-audit --no-fund @rollup/rollup-linux-x64-gnu@$(node -p "require(\"./node_modules/rollup/package.json\").version") && npm run test:e2e -- e2e/mg-r04-immutable-metric-uat.spec.ts'

      - name: Require browser E2E without failure or skip
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('frontend/test-results/junit.xml').getroot()
          suites=[root] if root.tag=='testsuite' else list(root.iter('testsuite'))
          n=sum(int(x.attrib.get('tests',0)) for x in suites)
          errors=sum(int(x.attrib.get('errors',0)) for x in suites)
          failed=sum(int(x.attrib.get('failures',0)) for x in suites)
          skipped=sum(int(x.attrib.get('skipped',0)) for x in suites)
          print({'tests':n,'errors':errors,'failures':failed,'skipped':skipped})
          if n!=1 or errors or failed or skipped:raise SystemExit('FIN_MG_R04_BROWSER_E2E_NOT_GREEN')
          PY

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-mg-r04-browser
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn

      - name: Backend diagnostics on failure
        if: failure()
        run: tail -n 180 /tmp/fin-mg-r04-backend.log || true
