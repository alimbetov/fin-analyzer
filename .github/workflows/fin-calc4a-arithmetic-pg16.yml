name: FIN CALC-4A — Arithmetic DAG SQL/JDBC PG16

on:
  push:
    branches:
      - feat/fin-form-library-standalone
    paths:
      - 'form-library/src/main/java/kz/fin/formlib/calc/hybrid/Calc154CandidateArithmeticJdbcEngine.java'
      - 'form-library/src/test/java/kz/fin/formlib/calc/hybrid/Calc154CandidateArithmeticEnginePostgresqlTest.java'
      - 'form-library/src/main/resources/db/changelog/035-fin-calc154-versioned-formula-contracts-postgresql.sql'
      - 'form-library/src/main/resources/db/changelog/036-fin-calc154-calc3b-requirements-and-lineage-postgresql.sql'
      - '.github/workflows/fin-calc4a-arithmetic-pg16.yml'
      - 'form-library/pom.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arithmetic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: form-library/pom.xml
      - name: Run seven real PG16 arithmetic SQL/JDBC candidate DAG tests
        run: |
          mvn -B -ntp -f form-library/pom.xml test \
            -Dfin.postgres.uat.enabled=true \
            -Dtest=Calc154CandidateArithmeticEnginePostgresqlTest \
            -DfailIfNoTests=true
      - name: Reject skipped or missing real PostgreSQL acceptance
        if: always()
        run: |
          python3 - <<'PY'
          import glob,sys,xml.etree.ElementTree as ET
          files=glob.glob('form-library/target/surefire-reports/TEST-*Calc154CandidateArithmeticEnginePostgresqlTest.xml')
          if len(files)!=1: sys.exit('FAIL CALC4A: PG16 report missing')
          r=ET.parse(files[0]).getroot()
          actual={k:int(r.attrib.get(k,0)) for k in ('tests','errors','failures','skipped')}
          print(actual)
          if actual!={'tests':7,'errors':0,'failures':0,'skipped':0}:
              sys.exit('FAIL CALC4A: expected seven PostgreSQL tests, no skips/errors')
          PY
