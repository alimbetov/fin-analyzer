name: FIN AUTOQUAL-1 — Gate and Receipt PG16

on:
  push:
    branches:
      - feat/fin-form-library-standalone
    paths:
      - 'form-library/src/main/java/kz/fin/formlib/calc/qualify/**'
      - 'form-library/src/test/java/kz/fin/formlib/calc/qualify/**'
      - 'form-library/src/main/resources/db/changelog/049-fin-autoqual1-receipt-postgresql.sql'
      - 'form-library/src/main/resources/db/changelog/db.changelog-master.yaml'
      - '.github/workflows/fin-autoqual1-pg16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autoqual1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: form-library/pom.xml
      - name: AUTOQUAL-1 UAT-only unit and PostgreSQL integration tests
        run: |
          mvn -B -ntp -f form-library/pom.xml test \
            -Dfin.postgres.uat.enabled=true \
            -Dtest=MethodQualificationEvaluatorTest,MethodQualificationReceiptPostgresqlTest \
            -DfailIfNoTests=true
      - name: Require all specified tests and zero skipped
        run: |
          python3 - <<'PY'
          import glob,sys,xml.etree.ElementTree as ET
          names=['MethodQualificationEvaluatorTest','MethodQualificationReceiptPostgresqlTest']
          counts=[]
          for name in names:
            files=glob.glob('form-library/target/surefire-reports/TEST-*'+name+'.xml')
            if len(files)!=1:sys.exit('missing report for '+name)
            root=ET.parse(files[0]).getroot()
            counts.append({k:int(root.attrib.get(k,0)) for k in ('tests','errors','failures','skipped')})
          print(counts)
          if sum(r['tests'] for r in counts)!=9 or any(r[k] for r in counts for k in ('errors','failures','skipped')):
            sys.exit('AUTOQUAL-1 must pass 9 tests with no skips')
          PY
