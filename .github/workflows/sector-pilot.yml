name: FIN sector pilot tests
on:
  push:
    paths:
      - "packages/sector-pilot/**"
      - ".github/workflows/sector-pilot.yml"
  pull_request:
    paths:
      - "packages/sector-pilot/**"
      - ".github/workflows/sector-pilot.yml"
jobs:
  sector-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
        working-directory: packages/sector-pilot
      - run: npm run demo > /dev/null
        working-directory: packages/sector-pilot
