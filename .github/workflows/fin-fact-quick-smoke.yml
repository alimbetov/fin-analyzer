name: FIN FACT — Quick PG16 Smoke

on:
  push:
    branches:
      - feat/fin-form-library-standalone
    paths:
      - scripts/smoke-fin-fact.sh
      - .github/workflows/fin-fact-quick-smoke.yml
      - form-library/src/main/**
      - form-library/src/test/java/kz/fin/formlib/calc/**
      - form-library/pom.xml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fact-smoke:
    name: 7 isolated INGEST/FACT smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: form-library/pom.xml
      - name: Check macOS-compatible Bash syntax
        run: bash -n scripts/smoke-fin-fact.sh
      - name: Run isolated PostgreSQL16 smoke without external services
        run: bash scripts/smoke-fin-fact.sh --quick
