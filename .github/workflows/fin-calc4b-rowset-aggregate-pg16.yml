name: FIN CALC-4B — C07 C09 Aggregate SQL/JDBC PG16

on:
  push:
    branches:
      - feat/fin-form-library-standalone
    paths:
      - 'form-library/src/main/java/kz/fin/formlib/calc/hybrid/Calc154AggregateFormulaJdbcPreview.java'
      - 'form-library/src/test/java/kz/fin/formlib/calc/hybrid/Calc154AggregateFormulaJdbcPreviewPostgresqlTest.java'
      - '.github/workflows/fin-calc4b-rowset-aggregate-pg16.yml'
      - 'form-library/pom.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rowset-aggregates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: form-library/pom.xml
      - name: Run real PostgreSQL C07 C09 native SQL/JDBC aggregate tests
        run: |
          mvn -B -ntp -f form-library/pom.xml test \
            -Dfin.postgres.uat.enabled=true \
            -Dtest=Calc154AggregateFormulaJdbcPreviewPostgresqlTest \
            -DfailIfNoTests=true
      - name: Enforce five real successful PostgreSQL rowset tests
        if: always()
        run: |
          python3 - <<'PY'
          import glob,sys,xml.etree.ElementTree as ET
          files=glob.glob('form-library/target/surefire-reports/TEST-*Calc154AggregateFormulaJdbcPreviewPostgresqlTest.xml')
          if len(files)!=1:sys.exit('FAIL CALC4B ROWSET: PG16 report missing')
          root=ET.parse(files[0]).getroot()
          a={k:int(root.attrib.get(k,0)) for k in ('tests','errors','failures','skipped')}
          print(a)
          if a!={'tests':5,'errors':0,'failures':0,'skipped':0}:
              sys.exit('FAIL CALC4B ROWSET: requires 5/5 real PostgreSQL tests')
          PY
