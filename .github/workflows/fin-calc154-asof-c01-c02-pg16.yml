name: FIN CALC-C01/C02 and CALC-154 — PG16 E2E

on:
  push:
    branches:
      - feat/fin-form-library-standalone
    paths:
      - 'form-library/src/main/java/kz/fin/formlib/calc/hybrid/CalcAsOfDebtKernel.java'
      - 'form-library/src/main/java/kz/fin/formlib/calc/hybrid/CalcC01C02AsOfJdbcService.java'
      - 'form-library/src/main/java/kz/fin/formlib/calc/readiness/Calc154BatchTechnicalClassification.java'
      - 'form-library/src/test/java/kz/fin/formlib/calc/hybrid/CalcAsOfDebtKernelTest.java'
      - 'form-library/src/test/java/kz/fin/formlib/calc/hybrid/CalcC01C02AsOfPostgresqlTest.java'
      - 'form-library/src/test/java/kz/fin/formlib/calc/readiness/Calc154BatchTechnicalClassificationPostgresqlTest.java'
      - 'form-library/src/main/resources/db/changelog/050-fin-calc154-asof-c01-c02-uat-postgresql.sql'
      - 'form-library/src/main/resources/db/changelog/db.changelog-master.yaml'
      - '.github/workflows/fin-calc154-asof-c01-c02-pg16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calc154-asof-c01-c02:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: form-library/pom.xml
      - name: Java BigDecimal and real PostgreSQL16 E2E with Liquibase
        run: |
          mvn -B -ntp -f form-library/pom.xml test \
            -Dfin.postgres.uat.enabled=true \
            -Dtest=CalcAsOfDebtKernelTest,CalcC01C02AsOfPostgresqlTest,Calc154BatchTechnicalClassificationPostgresqlTest \
            -DfailIfNoTests=true
      - name: Require 10 actual tests without skipping
        run: |
          python3 - <<'PY'
          import glob,sys,xml.etree.ElementTree as ET
          names=['CalcAsOfDebtKernelTest','CalcC01C02AsOfPostgresqlTest',
                 'Calc154BatchTechnicalClassificationPostgresqlTest']
          report=[]
          for n in names:
            f=glob.glob('form-library/target/surefire-reports/TEST-*'+n+'.xml')
            if len(f)!=1:sys.exit('MISSING_REPORT:'+n)
            x=ET.parse(f[0]).getroot()
            report.append({k:int(x.attrib.get(k,0)) for k in ('tests','errors','failures','skipped')})
          print(report)
          if sum(x['tests'] for x in report)!=10 or any(x[k] for x in report for k in ('errors','failures','skipped')):
            sys.exit('CALC154_C01_C02_E2E_NOT_GREEN')
          PY
