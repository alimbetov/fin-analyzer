spring:
  application:
    name: fin-backend
  datasource:
    url: ${FIN_DB_URL:jdbc:postgresql://localhost:5432/fin}
    username: ${FIN_DB_USER:fin}
    password: ${FIN_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

fin:
  security:
    enabled: ${FIN_SECURITY_ENABLED:false}
    issuer: ${FIN_OIDC_ISSUER:}
    jwks-uri: ${FIN_OIDC_JWKS_URI:}
    audience: ${FIN_OIDC_AUDIENCE:fin-analyzer-api}
    ui-origin: ${FIN_UI_ORIGIN:}
  diagnostics:
    actual-preview-enabled: ${FIN_ACTUAL_PREVIEW_ENABLED:false}
