spring:
  application:
    name: fin-backend
  datasource:
    url: ${FIN_DB_URL:jdbc:postgresql://localhost:5432/fin}
    username: ${FIN_DB_USER:fin}
    password: ${FIN_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
